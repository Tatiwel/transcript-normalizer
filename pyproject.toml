[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-normalizer"
version = "0.1.0"
description = "Domain-term normalization for ASR transcripts and auto-captions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Oliveira" }]
dependencies = [
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ingest = [
    "yt-dlp>=2024.1.1",
    "faster-whisper>=1.0",
]

[project.scripts]
transcript-normalizer = "transcript_normalizer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
