[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-normalizer"
version = "0.5.1"
description = "Domain-term normalization for ASR transcripts and auto-captions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Oliveira" }]
keywords = ["asr", "captions", "subtitles", "text-normalization", "terminology", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# D-053: `menu` is the interactive menu's arrow keys and colour.
# D-052: `captions` is fetch with platform captions only (the `lite` executable);
# `ingest` adds local speech recognition (the `full` executable). Both carry `menu`.
menu = [
    "rich>=13.0",
    "questionary>=2.0",
]
captions = [
    "transcript-normalizer[menu]",
    # 2024.03.10 is the first release with --impersonate, which curl_cffi enables.
    "yt-dlp>=2024.3.10",
    "curl_cffi>=0.7",
]
ingest = [
    "transcript-normalizer[captions]",
    # D-058: faster-whisper 1.2 opens audio with av.open(..., metadata_errors=),
    # which av 19 removed. Upper bounds, so a fresh resolve cannot pair them again.
    "faster-whisper>=1.0,<1.3",
    "av>=11,<19",
]

[project.urls]
Homepage = "https://github.com/Tatiwel/transcript-normalizer"
Issues = "https://github.com/Tatiwel/transcript-normalizer/issues"

[project.scripts]
transcript-normalizer = "transcript_normalizer.cli:main"

[dependency-groups]
# Every extra, so a plain `uv sync` in the repository keeps them: `ingest`
# carries `captions`, which carries `menu`.
dev = ["transcript-normalizer[ingest]", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
