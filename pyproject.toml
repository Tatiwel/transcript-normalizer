[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-normalizer"
version = "0.3.0"
description = "Domain-term normalization for ASR transcripts and auto-captions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Oliveira" }]
keywords = ["asr", "captions", "subtitles", "text-normalization", "terminology", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ingest = [
    # 2024.03.10 is the first release with --impersonate, which curl_cffi enables.
    "yt-dlp>=2024.3.10",
    "curl_cffi>=0.7",
    "faster-whisper>=1.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/Tatiwel/transcript-normalizer"
Issues = "https://github.com/Tatiwel/transcript-normalizer/issues"

[project.scripts]
transcript-normalizer = "transcript_normalizer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "rich>=13.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
