# Termos de financas, pt-BR.
# 0.1.0 veio do gabarito de R2Qgz8tFWVI. Termo com "?" no gabarito nao entrou.
# 0.2.0 acrescenta os termos de wxgFO_fyfXg (linhas conferido e alias do gold).
# 0.2.1 acrescenta variantes de wxgFO_fyfXg a termos que ja existiam, e os plurais
# de preço teto como aliases.
# 0.2.2 tira variantes que sao palavras comuns (D-032) e acrescenta market cap.
# 0.2.3 acrescenta variantes de preço teto que o fuzzy nao alcanca (abaixo de 80).
# 0.2.4 acrescenta o que 4wCtn8BWR4o mostrou: evitida, dividendio, preço alvo e
# dívida líquida. preço alvo fica sem variante: `preço alto` sao duas palavras comuns (D-032).
# 0.3.0 acrescenta os termos de 4tTmY8Buask (linhas conferido do gold) e tira `bicho`
# (EBITDA) e `dividend` (dividendo), palavras que o gold mostra com outro sentido (D-032).
# Ficam de fora `apos` (é `após` sem acento) e `Portes`, `porta`, `portas`, `Port`, `sel`.
# 0.3.1 acrescenta `commodity` como alias de commodities: o singular não é erro (D-047).
# 0.3.2 acrescenta `dividend` como alias de dividend yield: a forma curta do locutor
# (3 de 3 ocorrências conferidas em 4tTmY8Buask). Custo medido: em R2Qgz8tFWVI 15:59
# `dividend` é dividendo, e em wxgFO_fyfXg o alias, já escrito dentro de `dividend y`,
# bloqueia essa variante pela regra de D-030 (3 acertos perdidos).
# 0.3.3 acrescenta `Partens` e `partner` a BR Partners (4tTmY8Buask 7:48 e 11:39).
# `A Partens` nao entra: artigo mais nome, duas palavras.
# 0.3.4 tira `Ox` de OPEX: e o `oxe` nordestino, palavra comum (D-032, D-035).
# 0.3.5 troca a variante `trio` de tri por `primeiro/segundo/terceiro/quarto trio`:
# sozinha, `trio` e palavra comum (D-032; "trio de irmas" em yJxxTf0IQC8).
# 0.3.6 declara as classes do pacote (D-064): as oito de D-021. Nenhum termo muda.
# 0.3.7 declara as classes foneticas (D-068): as duas de D-050, como foram medidas.
# 0.3.8 devolve `Ox` a OPEX com contexto (D-086), a primeira variante condicionada do pacote:
# so conta num video em que CAPEX aparece (duas vezes para aplicar, uma para perguntar).
# Fora disso continua sendo o `oxe` nordestino, e nao e proposta (D-035).
# 0.3.9 tira 32 variantes que sao palavra ou frase comum, curtas demais ou iguais a outro
# termo (D-032): CEMIG (`esse amigo`, `me caiu`, `do 100`, `sem amig`, `SEMI`, `CIC`), CPF,
# taa, arte, bit e EBA (EBITDA), B, bit e be (bilhao), rap e rápid (RAP), valo, TR, india, End, Word, NSS,
# Lu, anel, deck, ESA, Roy e ROI (ROE), ROK, Rid, Portou e partner (BR Partners).
# Nenhuma volta condicionada: se o erro reaparecer, entra de uma transcricao futura, com gabarito.
# A regra de unidade "numero + B/bit/bi/be" nao muda. Ficam `no bank`, `PCA`, `apo` e `Ox`.
# 0.4.0 acrescenta 282 companhias geradas de fontes/acoes.csv por tools/gerar_termos.py, no bloco delimitado no fim dos termos, todas com `match: exact` (D-090), e tira dois aliases de mais de 3 palavras, que nunca casam (`dívida líquida sobre EBITDA`, `agência nacional de energia elétrica`).
