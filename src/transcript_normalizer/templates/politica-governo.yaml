# Field template politica-governo (D-065): a pack with no terms.
# `transcript-normalizer pack create --template politica-governo --name <name> --lang <code>`
# writes packs/<name>.yaml from it, with NAME and LANG filled in.
# pessoa, organizacao, sigla and unidade are allowed in every pack (D-064).
template: politica-governo
name: NAME
description:
  en: "Politics and government: public bodies, offices, programmes, laws."
  pt-BR: "Política e governo: órgãos, cargos, programas, leis."
language: LANG
version: 0.1.0
classes: [orgao, cargo, programa, lei]
terms: []
