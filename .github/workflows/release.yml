# Release: when a tag like v0.4.0 is pushed, build everything D-052 promises
# and attach it to a GitHub Release for that tag:
#
#   - the Python package (wheel and sdist), for `pip install`;
#   - a standalone executable per system, in two builds:
#       lite: fetch with platform captions only, small;
#       full: local speech recognition included, large;
#   - a sha256 checksum of every file, and the CHANGELOG section as the text.
#
# Jobs run in parallel unless one `needs` another. The order here is:
#   check -> (package, executable x 6) -> release

name: release

on:
  push:
    tags: ["v*"]

# The release job creates a Release and uploads files to it, which needs write
# access to the repository's contents. Nothing else is granted.
permissions:
  contents: write

defaults:
  run:
    # One shell everywhere, so every `run:` below is the same script on
    # Windows as on Linux and macOS (Git for Windows provides bash).
    shell: bash

jobs:
  # ---------------------------------------------------------------- 0. check
  check:
    # Stop early if the tag and the code disagree: tag v0.4.0 must be version
    # 0.4.0 in pyproject.toml, and CHANGELOG.md must have a `## 0.4.0` section.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag, pyproject and CHANGELOG agree
        run: |
          tag="${GITHUB_REF_NAME#v}"  # v0.4.0 -> 0.4.0
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $declared"
            exit 1
          fi
          if ! grep -q "^## $tag\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $tag' section"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- 1. package
  package:
    # The wheel and the source distribution, exactly as `uv build` makes them
    # locally. They are what `pip install` would download.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        run: uv build
      # Hand the files to the release job. Artifacts are how jobs pass files:
      # each job runs on its own machine and shares nothing else.
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  # ---------------------------------------------------------------- 2-3. executables
  executable:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        flavor: [lite, full]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v4

      # PyInstaller packs the Python interpreter of the runner into the
      # executable, so this version is the one users get.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Names used below: the system as users know it, and the file extension.
      # Linux and macOS executables are archived so the "can run" permission
      # survives the download; Windows needs no archive.
      - name: Names
        run: |
          case "$RUNNER_OS" in
            Windows) os=windows; ext=exe ;;
            Linux)   os=linux;   ext=tar.gz ;;
            macOS)   os=macos;   ext=zip ;;
          esac
          name="transcript-normalizer-$VERSION-$os-$FLAVOR"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "ASSET=$name.$ext" >> "$GITHUB_ENV"

      # The build environment, from uv.lock: exactly the versions the tests ran
      # with, never a fresh resolve. `uv pip install ".[extra]"` ignored the
      # lock and paired faster-whisper 1.2 with av 19, which broke audio
      # decoding in 0.4.3's full build (D-058). `lite` takes [captions]
      # (yt-dlp, curl_cffi, and [menu]: rich and questionary); `full` takes
      # [ingest] (the same, plus faster-whisper). --no-dev leaves pytest out;
      # --no-editable installs the package itself, not a link to src/.
      # PyInstaller is a build tool, not a dependency, so it is added on top.
      #
      # Linux (D-061): setup-uv's python-version takes the runner's own
      # /usr/bin/python3.12 when there is one, and that Python has no tkinter,
      # so the folder dialog was missing from 0.5.0's Linux executables. There
      # the venv is built from a uv-managed Python, which ships tkinter, and
      # the step stops at once if tkinter does not import.
      - name: Tk libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # Belt and braces: the system's libtk and libtcl, for PyInstaller to collect.
          sudo apt-get update -q
          sudo apt-get install -y python3-tk tk
      - name: Install
        run: |
          if [ "$FLAVOR" = lite ]; then extra=captions; else extra=ingest; fi
          python_args=()
          if [ "$RUNNER_OS" = Linux ]; then
            uv python install 3.12
            python_args=(--python 3.12 --python-preference only-managed)
          fi
          uv sync --locked --no-dev --no-editable --extra "$extra" "${python_args[@]}"
          uv pip install pyinstaller
          uv run --no-sync python -c 'import sys, tkinter; print(sys.executable, "tkinter", tkinter.TkVersion)'

      # Build one executable file. What each flag is for:
      #   --onefile              one file to download and double-click
      #   --console              a terminal window, which the menu needs
      #   --collect-submodules transcript_normalizer
      #                          language modules are imported by name at run
      #                          time (D-033), which PyInstaller cannot see
      #   --collect-data transcript_normalizer
      #                          the bundled pack, a YAML file (D-043)
      #   --collect-submodules yt_dlp
      #                          yt-dlp loads its site extractors by name
      #   --copy-metadata transcript-normalizer
      #                          the version the menu's first screen shows
      #   --collect-submodules tkinter, --hidden-import tkinter.filedialog
      #                          Settings' folder dialog (D-061); imported only
      #                          inside a function, and with it the Tcl/Tk
      #                          libraries PyInstaller's tkinter hook adds
      #   --collect-all ...      (full) the speech stack: compiled libraries
      #                          and data files PyInstaller would miss. No
      #                          ffmpeg program: faster-whisper decodes audio
      #                          through PyAV, which carries its own FFmpeg
      #                          libraries (D-052, amended)
      - name: Build executable
        run: |
          full_args=""
          if [ "$FLAVOR" = full ]; then
            for pkg in faster_whisper ctranslate2 onnxruntime av tokenizers; do
              full_args="$full_args --collect-all $pkg"
            done
          fi
          uv run --no-sync pyinstaller --onefile --console --name "$NAME" \
            --collect-submodules transcript_normalizer \
            --collect-data transcript_normalizer \
            --collect-submodules yt_dlp \
            --copy-metadata transcript-normalizer \
            --collect-submodules tkinter \
            --hidden-import tkinter.filedialog \
            $full_args \
            packaging/entry.py

      # Prove the executable starts, finds its bundled pack and language module,
      # and writes into the data directory (D-052), before anyone downloads it.
      - name: Smoke test
        run: |
          exe="dist/$NAME"; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" help
          export TRANSCRIPT_NORMALIZER_HOME="$RUNNER_TEMP/tn-home"
          "$exe" fixtures/R2Qgz8tFWVI/legenda.txt
          test -f "$TRANSCRIPT_NORMALIZER_HOME/runs/R2Qgz8tFWVI/normalized.txt"

      # D-061: the folder dialog's parts are inside: tkinter.filedialog imports
      # and a Tcl interpreter starts (its library files were bundled). No
      # window, so no display is needed.
      - name: Folder dialog imports
        run: |
          exe="dist/$NAME"; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" help --check-picker | tee picker.txt
          grep -Eq '^tkinter [0-9]+\.[0-9]+.*, filedialog tkinter\.filedialog' picker.txt

      # D-058: the audio stack decodes inside the full executable, with no
      # model and no network: two seconds of a 440 Hz tone, 32000 samples.
      - name: Audio decodes (full)
        if: matrix.flavor == 'full'
        run: |
          exe="dist/$NAME"; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" fetch --selftest-audio tests/data/two-seconds.wav | tee selftest.txt
          grep -q 'decoded 32000 samples' selftest.txt

      # D-057: the fetch tools are inside the executable and importable.
      # yt-dlp in both flavors; faster-whisper only in `full`.
      - name: Fetch tools present
        run: |
          exe="dist/$NAME"; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" fetch --check | tee check.txt
          grep -Eq '^yt-dlp +[0-9]' check.txt
          if [ "$FLAVOR" = full ]; then
            grep -Eq '^faster-whisper +[0-9]' check.txt
          else
            grep -Eq '^faster-whisper +not installed' check.txt
          fi

      # D-057: fetch reaches yt-dlp in this process. Before 0.4.3 it ran
      # `<exe> -m yt_dlp`, which re-entered our own CLI and failed with
      # argparse's "invalid choice: 'yt_dlp'". This needs the network, and
      # YouTube may refuse a datacenter runner, so the test accepts a track
      # list, an HTTP 429, or YouTube's bot check (all three come from yt-dlp
      # itself, which is what is being proved), and fails on a traceback or
      # an argparse error.
      - name: Fetch reaches YouTube
        run: |
          exe="dist/$NAME"; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          export TRANSCRIPT_NORMALIZER_HOME="$RUNNER_TEMP/tn-home"
          set +e
          "$exe" fetch --list https://youtu.be/4wCtn8BWR4o > list.txt 2>&1
          status=$?
          set -e
          cat list.txt
          if grep -Eq 'Traceback|invalid choice|^usage:' list.txt; then
            echo "::error::fetch did not reach yt-dlp"; exit 1
          elif [ "$status" = 0 ] && grep -q '^ *original:' list.txt; then
            echo "track list: ok"
          elif grep -Eq 'HTTP Error 429|Too Many Requests' list.txt; then
            echo "::warning::YouTube answered HTTP 429; yt-dlp ran, which is what this checks"
          elif grep -q 'Sign in to confirm' list.txt; then
            echo "::warning::YouTube asked this runner to sign in; yt-dlp ran, which is what this checks"
          else
            echo "::error::unexpected answer from fetch --list (exit $status)"; exit 1
          fi

      # The file users download, named transcript-normalizer-<version>-<os>-<flavor>.<ext>.
      - name: Archive
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) cp "dist/$NAME.exe" "out/$ASSET" ;;
            Linux)   tar -czf "out/$ASSET" -C dist "$NAME" ;;
            macOS)   (cd dist && zip -q "../out/$ASSET" "$NAME") ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/*

  # ---------------------------------------------------------------- 4. release
  release:
    # Waits for everything above; if any build failed, there is no release.
    needs: [check, package, executable]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Every artifact from the jobs above, into one folder.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The release text, in three parts:
      #   1. "Which file do I download?", in English and Portuguese, from
      #      packaging/release-header.md, with this version filled in;
      #   2. the CHANGELOG section for this version;
      #   3. a checksum per file, so a user can check that a download is intact
      #      (`sha256sum <file>`, or `certutil -hashfile <file> SHA256` on Windows).
      - name: Release notes
        run: |
          sed "s/VERSION/$VERSION/g" packaging/release-header.md > notes.md
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / {on=0} on' CHANGELOG.md >> notes.md
          {
            echo
            echo "### SHA-256"
            echo
            echo '```'
            (cd assets && sha256sum *)
            echo '```'
          } >> notes.md
          cat notes.md

      # Create the Release for this tag and attach every file. `gh` is
      # GitHub's command-line tool, already on the runner; GH_TOKEN lets it act
      # for this repository with the permission granted at the top.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes-file notes.md
